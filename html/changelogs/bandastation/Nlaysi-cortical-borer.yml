changes:
  - rscadd: "Добавлены мозговые черви из Paradise для административного тестмержа: заражение носителей, мысленная связь, временный контроль, химия, развитие и размножение с личинками для призраков."
  - rscadd: "Носители могут сопротивляться контролю, сахар подавляет способности паразита, а медики могут обнаружить и извлечь его."
